<!doctype html>
<html><head><meta charset="utf-8"><title>Sharp animated canvas</title>
<style>body{margin:0;font-family:sans-serif}#c{width:300px;height:200px;display:block}</style></head>
<body>
<h1>Canvas that scales its buffer by devicePixelRatio</h1>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  let tick = 0;
  function frame() {
    tick++;
    ctx.fillStyle = 'hsl(' + (tick % 360) + ', 70%, 50%)';
    ctx.fillRect(0, 0, 300, 200);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body></html>
