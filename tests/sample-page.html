<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Audit Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; }
    .box { border: 1px solid #444; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    /* Blurry canvas: CSS is 400x200, but buffer is hardcoded 400x200 without DPR multiplication */
    #canvas-blurry { width: 400px; height: 200px; background: #222; }
    /* Sharp canvas: CSS is 400x200, buffer is set via JS with DPR */
    #canvas-sharp { width: 400px; height: 200px; background: #1a1a2e; }
    /* Tiny touch button under 32px */
    .tiny-btn { width: 24px; height: 24px; padding: 0; font-size: 10px; background: red; color: white; border: none; }
  </style>
</head>
<body>
  <h1>Phòng Thử Nghiệm: canvas-audit-mcp</h1>
  
  <div class="box">
    <h3>1. Canvas Mờ (Chưa nhân DPR)</h3>
    <canvas id="canvas-blurry" width="400" height="200"></canvas>
  </div>

  <div class="box">
    <h3>2. Canvas Chuẩn Nét (Đã nhân DPR)</h3>
    <canvas id="canvas-sharp"></canvas>
  </div>

  <div class="box">
    <h3>3. Kiểm tra Nút Bấm Công Thái Học</h3>
    <button class="tiny-btn" title="Nút quá bé">X</button> <span><- Nút này rộng 24x24px (sẽ bị bắt lỗi < 32px)</span>
  </div>

  <script>
    // 1. Draw blurry canvas
    const c1 = document.getElementById('canvas-blurry');
    const ctx1 = c1.getContext('2d');
    ctx1.fillStyle = '#ff6b6b';
    ctx1.font = '24px sans-serif';
    ctx1.fillText('Chữ này sẽ bị mờ trên Retina!', 20, 100);

    // 2. Draw sharp canvas using DPR
    const c2 = document.getElementById('canvas-sharp');
    const dpr = window.devicePixelRatio || 1;
    c2.width = 400 * dpr;
    c2.height = 200 * dpr;
    const gl = c2.getContext('webgl2') || c2.getContext('webgl');
    if (gl) {
      gl.viewport(0, 0, c2.width, c2.height);
      gl.clearColor(0.1, 0.2, 0.4, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      // Context recovery listeners
      c2.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        console.log('Test Page: Caught webglcontextlost!');
      }, false);
      c2.addEventListener('webglcontextrestored', () => {
        gl.clearColor(0.2, 0.6, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        console.log('Test Page: Restored WebGL context!');
      }, false);
    }

    // Animation loop for frametime profiling
    let angle = 0;
    function loop() {
      angle += 0.05;
      if (gl) {
        gl.clearColor(0.1 + Math.sin(angle) * 0.05, 0.2, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
