<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Blurry animated canvas</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #c { width: 300px; height: 200px; }
    </style>
  </head>
  <body>
    <h1>Canvas whose buffer ignores devicePixelRatio</h1>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById('c');
      canvas.width = 300;
      canvas.height = 200;
      const ctx = canvas.getContext('2d');
      let tick = 0;
      function frame() {
        tick++;
        ctx.fillStyle = 'hsl(' + (tick % 360) + ', 70%, 50%)';
        ctx.fillRect(0, 0, 300, 200);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
